name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip mogbattle.zip -d ./project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./project/mogbattle

      - name: Generate code
        run: dart run build_runner build -d
        working-directory: ./project/mogbattle

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./project/mogbattle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MogBattle-APK
          path: ./project/mogbattle/build/app/outputs/flutter-apk/app-release.apk
