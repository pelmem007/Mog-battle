name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and locate project
        id: locate
        run: |
          unzip mogbattle.zip -d ./project
          PUBSPEC=$(find ./project -name "pubspec.yaml" -type f | head -1)
          DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Update Android Embedding
        run: flutter create .
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Generate code
        run: dart run build_runner build -d
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MogBattle-APK
          path: ${{ steps.locate.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
